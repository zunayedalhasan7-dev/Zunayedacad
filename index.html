<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zunayed Academy</title>
    <script>
      // Pre-emptive fix for "Cannot set property fetch of #<Window> which has only a getter"
      // This happens when a library tries to assign to window.fetch but it's defined as a getter-only property.
      (function() {
        function applyFix(obj) {
          try {
            var descriptor = Object.getOwnPropertyDescriptor(obj, 'fetch');
            if (descriptor && descriptor.configurable) {
              var currentFetch = obj.fetch;
              Object.defineProperty(obj, 'fetch', {
                get: function() { return currentFetch; },
                set: function(v) { 
                  console.log('Zunayed Academy: Intercepted fetch assignment');
                  currentFetch = v; 
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e) {}
        }
        applyFix(window);
        if (typeof Window !== 'undefined' && Window.prototype) {
          applyFix(Window.prototype);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
